name: Solana AI 100-cycle runner
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: solana-paper-engine
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore split state if present
        run: python state_storage.py restore
      - name: Execute 100 cycles and persist every cycle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -e
          for i in $(seq 1 100); do
            python run_cycle.py
            python state_storage.py pack
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A solana_state.json solana_state.parts solana_state.manifest.json solana_summary.json solana_model.pt strategy_history.json
            git commit -m "Persist Solana cycle $i [skip ci]" || true
            git push
            sleep 60
          done
          gh workflow run solana-cycle.yml --repo "$GH_REPOSITORY" --ref main
