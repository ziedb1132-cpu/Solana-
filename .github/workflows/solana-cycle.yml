name: Solana AI 100-cycle runner
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: solana-paper-engine
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore split state if present
        run: python state_storage.py restore
      - name: Validate code and feature schema
        run: |
          python -m compileall -q ai_model.py feature_engine.py news_engine.py run_cycle.py signal_manager.py solana_engine.py state_storage.py strategy_engine.py
          python - <<'PY'
          from feature_engine import build_features
          from strategy_engine import evaluate_strategies
          candles=[]
          for i in range(300):
              p=100+i*0.02
              candles.append({"ts":i,"o":p-0.01,"h":p+0.05,"l":p-0.05,"c":p,"vol":1000+i})
          features=build_features(candles,{"trend":0.01,"volatility":0.002},{"imbalance":0.1,"spread_pct":0.02},0.05)
          assert len(features)==1205, f"Expected 1205 features, got {len(features)}"
          assert len(evaluate_strategies(candles))==8, "Expected 8 strategy families"
          print("PREFLIGHT_OK features=1205 strategies=8")
          PY
      - name: Execute 100 cycles and persist every cycle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -e
          for i in $(seq 1 100); do
            python run_cycle.py
            python state_storage.py pack
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Persist Solana cycle $i [skip ci]" || true
            git push
            sleep 60
          done
          gh workflow run solana-cycle.yml --repo "$GH_REPOSITORY" --ref main
